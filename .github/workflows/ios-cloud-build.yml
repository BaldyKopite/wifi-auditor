name: iOS Cloud Build & Test (macOS)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build-and-test:
    name: Build & Test on Cloud Mac
    runs-on: macos-14 # Apple Silicon M2 runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project (.xcodeproj)
        run: |
          xcodegen generate
          ls -la

      - name: Run Unit Tests on iOS Simulator
        run: |
          xcodebuild test \
            -project WiFiAuditor.xcodeproj \
            -scheme WiFiAuditor \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify || true

      - name: Build App & Widget (Release)
        run: |
          xcodebuild build \
            -project WiFiAuditor.xcodeproj \
            -scheme WiFiAuditor \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./build

      - name: Locate & Compress Build Artifacts
        run: |
          mkdir -p output
          find ./build/Build/Products/Release-iphonesimulator -name "*.app" -exec cp -r {} output/ \;
          cd output && zip -r WiFiAuditor-Simulator-Build.zip .

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: WiFiAuditor-iOS-Build
          path: output/WiFiAuditor-Simulator-Build.zip
          retention-days: 14
