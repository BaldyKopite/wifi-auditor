name: iOS Cloud Build & Test (macOS)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.3.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode Project (.xcodeproj)
        run: |
          set -eux
          rm -rf WiFiAuditor.xcodeproj
          xcodegen generate
          grep -n "objectVersion" WiFiAuditor.xcodeproj/project.pbxproj | head
          ruby -e 'path = "WiFiAuditor.xcodeproj/project.pbxproj"; text = File.read(path); text = text.gsub("objectVersion = 77", "objectVersion = 60"); text = text.gsub(/objectVersion = (6[1-9]|[7-9]\d)/, "objectVersion = 60"); File.write(path, text)'
          grep -n "objectVersion" WiFiAuditor.xcodeproj/project.pbxproj | head

      - name: Resolve Simulator Device
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | test("iPhone"))][0].udid')
          if [ -z "$SIM_ID" ] || [ "$SIM_ID" = "null" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          fi
          echo "Selected Simulator ID: $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" || true

      - name: Build Application & Widget
        run: |
          xcodebuild build \
            -project WiFiAuditor.xcodeproj \
            -scheme WiFiAuditor \
            -destination "id=${{ env.SIM_ID }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath ./build

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project WiFiAuditor.xcodeproj \
            -scheme WiFiAuditor \
            -destination "id=${{ env.SIM_ID }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath ./build

      - name: Package Build Artifacts
        run: |
          mkdir -p output
          find ./build/Build/Products/Debug-iphonesimulator -name "*.app" -exec cp -r {} output/ \;
          cd output && zip -r WiFiAuditor-Simulator-Build.zip .

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: WiFiAuditor-iOS-Build
          path: output/WiFiAuditor-Simulator-Build.zip
          retention-days: 14
