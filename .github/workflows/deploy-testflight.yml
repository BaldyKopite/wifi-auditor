name: Deploy to Apple TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'TestFlight What to Test / Release Notes'
        required: false
        default: 'Automated release: WiFi Auditor security assessment and Dynamic Island update.'
  push:
    tags:
      - 'v*'

jobs:
  testflight-deploy:
    name: Build, Sign & Upload to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.3.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode Project (.xcodeproj)
        run: |
          set -eux
          rm -rf WiFiAuditor.xcodeproj
          xcodegen generate
          ruby -e 'path = "WiFiAuditor.xcodeproj/project.pbxproj"; text = File.read(path); text = text.gsub("objectVersion = 77", "objectVersion = 60"); text = text.gsub(/objectVersion = (6[1-9]|[7-9]\d)/, "objectVersion = 60"); File.write(path, text)'

      - name: Set Up Keychain and Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_ci_password' }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Apple Distribution certificate
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Set as default keychain
          security default-keychain -s $KEYCHAIN_PATH

      - name: Install Provisioning Profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.APPLE_APP_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "$APP_PROFILE_BASE64" ]; then
            echo -n "$APP_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          fi
          if [ -n "$WIDGET_PROFILE_BASE64" ]; then
            echo -n "$WIDGET_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/widget.mobileprovision
          fi

      - name: Run Unit Tests
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | test("iPhone"))][0].udid')
          if [ -z "$SIM_ID" ] || [ "$SIM_ID" = "null" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          fi
          xcrun simctl boot "$SIM_ID" || true

          xcodebuild test \
            -project WiFiAuditor.xcodeproj \
            -scheme WiFiAuditor \
            -destination "id=$SIM_ID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath ./build

      - name: Archive Application (.xcarchive)
        run: |
          xcodebuild archive \
            -project WiFiAuditor.xcodeproj \
            -scheme WiFiAuditor \
            -configuration Release \
            -archivePath ./build/WiFiAuditor.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=1.0.0

      - name: Export IPA Package
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/WiFiAuditor.xcarchive \
            -exportPath ./build/export \
            -exportOptionsPlist ./ExportOptions.plist

      - name: Upload to Apple TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          # Place API Key in standard App Store Connect location
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_CONTENT_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          # Upload IPA via Apple xcrun altool
          IPA_PATH=$(find ./build/export -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean Up Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true
