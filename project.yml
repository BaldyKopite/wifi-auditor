name: WiFiAuditor
options:
  bundleIdPrefix: com.wifiauditor
  deploymentTarget:
    iOS: "16.2"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.2"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "NO"

targets:
  WiFiAuditor:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: WiFiAuditor/WiFiAuditor/App
      - path: WiFiAuditor/WiFiAuditor/Models
      - path: WiFiAuditor/WiFiAuditor/Services
      - path: WiFiAuditor/WiFiAuditor/Views
    info:
      path: WiFiAuditor/WiFiAuditor/Resources/Info.plist
    entitlements:
      path: WiFiAuditor/WiFiAuditor/Resources/WiFiAuditorApp.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wifiauditor.app
      PRODUCT_NAME: WiFiAuditor
      TARGETED_DEVICE_FAMILY: "1"

  WiFiSafetyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: WiFiAuditor/WiFiSafetyWidget/WiFiSafetyWidgetBundle.swift
      - path: WiFiAuditor/WiFiSafetyWidget/WiFiSafetyWidget.swift
      - path: WiFiAuditor/WiFiAuditor/Models/WiFiSafetyAttributes.swift
    info:
      path: WiFiAuditor/WiFiSafetyWidget/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wifiauditor.app.widget
      PRODUCT_NAME: WiFiSafetyWidget
      TARGETED_DEVICE_FAMILY: "1"

  WiFiAuditorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: WiFiAuditor/Tests/WiFiAuditorTests
    dependencies:
      - target: WiFiAuditor
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wifiauditor.tests

schemes:
  WiFiAuditor:
    build:
      targets:
        WiFiAuditor: all
    test:
      targets:
        - name: WiFiAuditorTests
          parallelizable: true
